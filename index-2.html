<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firefly Duel</title>
<meta name="theme-color" content="#06100E">
<meta name="description" content="A 40-second reflex game. Catch fireflies before the moth does.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Firefly Duel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg1:#0E1F1C; --bg2:#06100E; --text:#E8F3EF; --muted:#8FAAA2;
  --mint:#7CF2C0; --coral:#FF6B6B; --fly:#FFE066; --gold:#FFA41B; --burr:#9B7BFF;
  --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg2);color:var(--text);font-family:var(--round);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
#app{position:relative;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  background:radial-gradient(circle at 85% 8%,rgba(200,235,225,.14),transparent 38%),linear-gradient(var(--bg1),var(--bg2));
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 18px 6px}
.side{display:flex;flex-direction:column;line-height:1}
.side.bot{text-align:right}
.lbl{font-size:13px;font-weight:600;margin-bottom:4px}
.you .lbl,.you .num{color:var(--mint)} .bot .lbl,.bot .num{color:var(--coral)}
.num{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;display:inline-block;transition:transform .12s}
.num.bump{transform:scale(1.25)}
.clock{width:54px;height:54px;border-radius:50%;border:2px solid rgba(232,243,239,.35);display:grid;place-items:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.clock.low{border-color:var(--coral);color:var(--coral)}
.bar{height:5px;margin:4px 18px 8px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--mint);transform-origin:left}
.bar.low i{background:var(--coral)}
#field{position:relative;flex:1;overflow:hidden}
.grass{position:absolute;left:0;right:0;bottom:0;height:46px;background:#040b09;pointer-events:none;z-index:3}

/* targets */
.t{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border:0;padding:0;background:none;cursor:pointer;z-index:1;
  animation:appear .18s ease-out}
@keyframes appear{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.fx{position:absolute;inset:0;filter:drop-shadow(0 0 7px var(--glow));pointer-events:none}
.core{position:absolute;inset:14px;border-radius:50%}
.fly{--glow:rgba(255,224,102,.9);--ringc:rgba(255,224,102,.85)}
.gold{--glow:rgba(255,164,27,.95);--ringc:rgba(255,164,27,.9)}
.burr{--glow:rgba(155,123,255,.8);--ringc:rgba(155,123,255,.85)}
.fly .core{background:radial-gradient(circle at 40% 35%,#fffbd0,#ffe066 60%,#f2b705)}
.gold .core{inset:8px;border-radius:0;clip-path:var(--star);background:linear-gradient(135deg,#fff1b8,#ffa41b)}
.burr .core{inset:10px;border-radius:0;clip-path:var(--burr);background:radial-gradient(circle,#c9b6ff,#6c4bd6)}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ringc);pointer-events:none;
  animation:shrink var(--life) linear forwards}
@keyframes shrink{from{transform:scale(1.45);opacity:.25}to{transform:scale(.62);opacity:1}}
.t.you,.t.bot,.t.hit{pointer-events:none;animation:out .35s ease-out forwards}
.t.hit{animation:shake .35s ease-out forwards}
@keyframes out{to{transform:scale(1.5);opacity:0}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px) scale(1.1)}to{transform:scale(1.4);opacity:0}}
.t.you::after,.t.bot::after{content:'';position:absolute;inset:4px;border-radius:50%;border:3px solid var(--mint);animation:flash .35s ease-out forwards}
.t.bot::after{border-color:var(--coral)}
@keyframes flash{to{transform:scale(1.7);opacity:0}}
.pop{position:absolute;font-weight:800;font-size:24px;pointer-events:none;z-index:4;transform:translate(-50%,-50%);animation:rise .75s ease-out forwards}
@keyframes rise{to{transform:translate(-50%,-150%);opacity:0}}

/* moth (computer) */
.moth{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;z-index:2;pointer-events:none;opacity:0;
  background:radial-gradient(circle,#ffd7d7,#ff6b6b 65%);box-shadow:0 0 16px 5px rgba(255,107,107,.55);transition:opacity .25s}
.moth.on{opacity:1}
.moth::before,.moth::after{content:'';position:absolute;top:3px;width:15px;height:20px;border-radius:50%;background:rgba(255,160,160,.5);animation:flap .11s infinite alternate}
.moth::before{left:-13px;transform-origin:right center}
.moth::after{right:-13px;transform-origin:left center;animation-direction:alternate-reverse}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.45)}}

/* overlays */
.ov{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:24px;text-align:center;background:rgba(5,13,11,.84);backdrop-filter:blur(4px)}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:42px;font-weight:800;letter-spacing:-.5px}
.ov h2{margin:0;font-size:34px;font-weight:800}
.sub{margin:0;color:var(--muted);max-width:30ch;font-size:16px}
.legend{display:flex;gap:22px}
.legend div{display:grid;justify-items:center;gap:2px;font-size:13px;color:var(--muted)}
.legend b{font-size:17px;color:var(--text)}
.ic{position:relative;display:block;width:44px;height:44px}
.seg{display:flex;gap:6px}
.seg button,.ghost{font:inherit;font-size:15px;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--text);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--text);color:#06100E;border-color:var(--text)}
.primary{font:inherit;font-size:20px;font-weight:800;padding:14px 44px;border-radius:999px;border:0;background:var(--mint);color:#06260F;cursor:pointer}
.primary:active{transform:scale(.97)}
.ghost{border-color:transparent;color:var(--muted)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.big{display:flex;align-items:baseline;gap:18px;font-size:60px;font-weight:800;font-variant-numeric:tabular-nums}
.big .y{color:var(--mint)} .big .b{color:var(--coral)} .big small{font-size:20px;color:var(--muted);font-weight:600}
.stats{margin:0;color:var(--muted);font-size:15px}
.count{font-size:120px;font-weight:800;animation:cd .65s ease-out}
@keyframes cd{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
.install{font:inherit;font-size:15px;font-weight:700;padding:10px 20px;border-radius:999px;border:2px solid var(--mint);background:transparent;color:var(--mint);cursor:pointer}
.hint{margin:0;color:var(--muted);font-size:13px;max-width:30ch}
@media (prefers-reduced-motion:reduce){.moth::before,.moth::after{animation:none}.count{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="side you"><span class="lbl">You</span><span class="num" id="sy">0</span></div>
    <div class="clock" id="clock">40</div>
    <div class="side bot"><span class="lbl" id="botlbl">Moth</span><span class="num" id="sb">0</span></div>
  </div>
  <div class="bar" id="bar"><i id="barfill"></i></div>
  <div id="field"><div class="moth" id="moth"></div><div class="grass" id="grass"></div></div>
  <div class="ov" id="ov" role="dialog" aria-live="polite"></div>
</div>

<script>
const DURATION = 40000;
const DIFF = {
  easy:  {label:'Easy',   react:520, per100:240, miss:.25},
  medium:{label:'Medium', react:320, per100:160, miss:.12},
  hard:  {label:'Hard',   react:180, per100:105, miss:.05}
};
const TYPES = { fly:{val:1,life:1800}, gold:{val:3,life:1250}, burr:{val:-2,life:1900} };

const $ = s => document.querySelector(s);
const field=$('#field'), moth=$('#moth'), ov=$('#ov');
const rnd=(a,b)=>a+Math.random()*(b-a);

/* clip-path shapes: gold = star, burr = spiky ball (different shapes help color-blind players) */
function poly(points,r1,r2){
  const pts=[]; for(let i=0;i<points*2;i++){const r=i%2?r2:r1,a=Math.PI*i/points-Math.PI/2;pts.push(`${(50+r*Math.cos(a)).toFixed(1)}% ${(50+r*Math.sin(a)).toFixed(1)}%`);}
  return `polygon(${pts.join(',')})`;
}
document.documentElement.style.setProperty('--star',poly(5,50,22));
document.documentElement.style.setProperty('--burr',poly(12,50,34));
(function grass(){const p=['0% 100%'];for(let i=0;i<=40;i++)p.push(`${i*2.5}% ${Math.round(rnd(8,70))}%`,`${i*2.5+1.2}% ${Math.round(rnd(35,100))}%`);p.push('100% 100%');$('#grass').style.clipPath=`polygon(${p.join(',')})`;})();

/* sound */
let ac=null, soundOn=true;
function beep(f,d=.09,type='sine',v=.07,when=0){
  if(!soundOn||!ac) return;
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+when;
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

/* state */
const g = { difficulty:'medium', running:false, you:0, bot:0, stats:null, targets:new Set(), run:0, timers:[], best:{}, raf:0, start:0 };
const bot = { busy:false, target:null, timer:0, x:0, y:0 };

function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),130); }
function setScores(){ $('#sy').textContent=g.you; $('#sb').textContent=g.bot; }
function pop(x,y,text,color){
  const p=document.createElement('div'); p.className='pop'; p.textContent=text; p.style.cssText=`left:${x}px;top:${y}px;color:${color}`;
  field.appendChild(p); setTimeout(()=>p.remove(),800);
}

/* targets */
function spawn(){
  if(!g.running||g.targets.size>=4) return;
  const prog=(performance.now()-g.start)/DURATION, r=Math.random();
  const type = r<.14?'gold' : r<.30?'burr' : 'fly';
  const w=field.clientWidth, h=field.clientHeight-50, pad=44;
  let x,y,ok=false;
  for(let i=0;i<14&&!ok;i++){
    x=rnd(pad,w-pad); y=rnd(pad,h-pad); ok=true;
    for(const t of g.targets){ if(Math.hypot(t.x-x,t.y-y)<86){ok=false;break;} }
  }
  const life=Math.round(TYPES[type].life*(1-.25*prog));
  const el=document.createElement('button');
  el.className=`t ${type}`; el.style.left=x+'px'; el.style.top=y+'px'; el.style.setProperty('--life',life+'ms');
  el.setAttribute('aria-label',{fly:'Firefly',gold:'Gold firefly',burr:'Burr, avoid'}[type]);
  el.innerHTML='<span class="ring"></span><span class="fx"><span class="core"></span></span>';
  const t={el,x,y,type,val:TYPES[type].val,claimed:false,timer:0};
  t.timer=setTimeout(()=>{ if(!t.claimed){ t.claimed=true; g.targets.delete(t); el.style.transition='opacity .2s'; el.style.opacity=0; setTimeout(()=>el.remove(),220);} },life);
  el._t=t; g.targets.add(t); field.appendChild(el);
}
function spawnLoop(run){
  if(!g.running||run!==g.run) return;
  spawn();
  const p=(performance.now()-g.start)/DURATION;
  g.timers.push(setTimeout(()=>spawnLoop(run), 720-290*p+rnd(0,180)));
}

function claim(t,who){
  if(t.claimed) return false;
  t.claimed=true; clearTimeout(t.timer); g.targets.delete(t);
  const burr=t.type==='burr';
  if(who==='you'){
    if(burr){
      g.you=Math.max(0,g.you+t.val); g.stats.burrs++; t.el.classList.add('hit');
      pop(t.x,t.y,'−2','var(--burr)'); beep(140,.22,'sawtooth',.09); buzz(90);
    }else{
      g.you+=t.val; t.type==='gold'?g.stats.gold++:g.stats.flies++; t.el.classList.add('you');
      pop(t.x,t.y,'+'+t.val,'var(--mint)');
      if(t.type==='gold'){beep(880,.08,'sine',.08);beep(1320,.14,'sine',.08,.07);} else beep(660,.08,'sine',.07);
      buzz(15);
    }
    bump($('#sy'));
  }else{
    g.bot+=t.val; t.el.classList.add('bot'); pop(t.x,t.y,'+'+t.val,'var(--coral)'); beep(300,.1,'triangle',.05); bump($('#sb'));
  }
  setScores();
  setTimeout(()=>t.el.remove(),360);
  return true;
}
field.addEventListener('pointerdown',e=>{
  if(!g.running) return;
  const el=e.target.closest('.t'); if(el&&el._t) claim(el._t,'you');
});

/* computer opponent */
function mothPos(){ const cs=getComputedStyle(moth); return {x:parseFloat(cs.left)||0,y:parseFloat(cs.top)||0}; }
function flyTo(x,y,ms){
  const p=mothPos();
  moth.style.transition='opacity .25s'; moth.style.left=p.x+'px'; moth.style.top=p.y+'px';
  void moth.offsetWidth;
  const ease='cubic-bezier(.3,.1,.3,1)';
  moth.style.transition=`left ${ms}ms ${ease}, top ${ms}ms ${ease}, opacity .25s`;
  moth.style.left=x+'px'; moth.style.top=y+'px';
}
function botThink(run){
  if(!g.running||run!==g.run) return;
  if(bot.busy){
    if(bot.target&&bot.target.claimed){ clearTimeout(bot.timer); bot.busy=false; } else return;
  }
  const opts=[...g.targets].filter(t=>!t.claimed&&t.type!=='burr'); if(!opts.length) return;
  const d=DIFF[g.difficulty], p=mothPos();
  const dist=t=>Math.hypot(t.x-p.x,t.y-p.y);
  let pick;
  if(g.difficulty==='easy') pick=opts[Math.floor(Math.random()*opts.length)];
  else pick=opts.sort((a,b)=>(dist(a)/(a.type==='gold'?2.2:1))-(dist(b)/(b.type==='gold'?2.2:1)))[0];
  const ms=Math.round(d.react*rnd(.85,1.2)+dist(pick)/100*d.per100);
  bot.busy=true; bot.target=pick; flyTo(pick.x,pick.y,ms);
  bot.timer=setTimeout(()=>{
    bot.busy=false;
    if(!g.running||run!==g.run||pick.claimed) return;
    if(Math.random()<d.miss) return;
    claim(pick,'bot');
  },ms);
}

/* round flow */
function clearRound(){
  g.running=false; g.run++; cancelAnimationFrame(g.raf);
  g.timers.forEach(clearTimeout); g.timers=[]; clearTimeout(bot.timer); bot.busy=false;
  g.targets.forEach(t=>clearTimeout(t.timer)); g.targets.clear();
  field.querySelectorAll('.t,.pop').forEach(n=>n.remove());
  moth.classList.remove('on');
}
function countdown(){
  clearRound(); g.you=0; g.bot=0; setScores();
  $('#barfill').style.transform='scaleX(1)'; $('#bar').classList.remove('low'); $('#clock').classList.remove('low'); $('#clock').textContent=DURATION/1000;
  $('#botlbl').textContent=`Moth (${DIFF[g.difficulty].label})`;
  let n=3; const step=()=>{
    if(n>0){ ov.hidden=false; ov.innerHTML=`<div class="count">${n}</div>`; beep(440,.1,'sine',.06); n--; setTimeout(step,650); }
    else { ov.innerHTML=`<div class="count">Go</div>`; beep(880,.18,'sine',.08); setTimeout(()=>{ov.hidden=true; begin();},350); }
  }; step();
}
function begin(){
  g.stats={flies:0,gold:0,burrs:0}; g.running=true; g.start=performance.now(); const run=g.run;
  moth.style.transition='none'; moth.style.left=(field.clientWidth*.88)+'px'; moth.style.top='30px'; void moth.offsetWidth; moth.classList.add('on');
  spawnLoop(run);
  g.timers.push(setInterval(()=>botThink(run),50));
  const frame=()=>{
    if(!g.running||run!==g.run) return;
    const remain=Math.max(0,DURATION-(performance.now()-g.start));
    $('#clock').textContent=Math.ceil(remain/1000);
    $('#barfill').style.transform=`scaleX(${remain/DURATION})`;
    const low=remain<8000; $('#bar').classList.toggle('low',low); $('#clock').classList.toggle('low',low);
    if(remain<=0) return finish();
    g.raf=requestAnimationFrame(frame);
  }; g.raf=requestAnimationFrame(frame);
}
function finish(){
  const margin=g.you-g.bot, stats=g.stats, d=g.difficulty;
  clearRound();
  [523,659,784,1047].forEach((f,i)=>beep(f,.16,'sine',.07,i*.09));
  let best='';
  if(margin>0 && margin>(g.best[d]||0)){ g.best[d]=margin; best=`<p class="stats" style="color:var(--mint)">New best win on ${DIFF[d].label}: +${margin}</p>`; }
  else if(g.best[d]) best=`<p class="stats">Best win on ${DIFF[d].label}: +${g.best[d]}</p>`;
  const head = margin>0?`You win by ${margin}` : margin<0?`Moth wins by ${-margin}` : 'Dead heat';
  setTimeout(()=>{
    ov.hidden=false;
    ov.innerHTML=`<h2>${head}</h2>
      <div class="big"><span class="y">${g.you}</span><small>to</small><span class="b">${g.bot}</span></div>
      <p class="stats">${stats.flies} fireflies, ${stats.gold} gold, ${stats.burrs} burr ${stats.burrs===1?'hit':'hits'}</p>${best}
      <button class="primary" data-act="start">Rematch</button>
      <button class="ghost" data-act="menu">Change difficulty</button>`;
  },500);
}

/* menu */
function showStart(){
  clearRound(); ov.hidden=false;
  const ic=t=>`<span class="ic ${t}"><span class="fx"><span class="core"></span></span></span>`;
  ov.innerHTML=`<h1>Firefly Duel</h1>
    <p class="sub">Tap fireflies before the moth does. Highest score after 40 seconds wins.</p>
    <div class="legend">
      <div>${ic('fly')}<b>+1</b>Firefly</div>
      <div>${ic('gold')}<b>+3</b>Gold</div>
      <div>${ic('burr')}<b>−2</b>Burr</div>
    </div>
    <div class="seg" role="group" aria-label="Moth difficulty">${Object.entries(DIFF).map(([k,v])=>`<button data-act="diff" data-v="${k}" aria-pressed="${k===g.difficulty}">${v.label}</button>`).join('')}</div>
    <button class="primary" data-act="start">Play</button>
    <button class="ghost" data-act="sound">Sound: ${soundOn?'on':'off'}</button>${installUI()}`;
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='diff'){ g.difficulty=b.dataset.v; ov.querySelectorAll('[data-act=diff]').forEach(x=>x.setAttribute('aria-pressed',x===b)); }
  else if(a==='sound'){ soundOn=!soundOn; b.textContent=`Sound: ${soundOn?'on':'off'}`; }
  else if(a==='start'){ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); ac.resume&&ac.resume(); countdown(); }
  else if(a==='menu'){ showStart(); }
  else if(a==='install'){ doInstall(); }
});
/* install (PWA) */
let deferredInstall=null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function installUI(){
  if(isStandalone()) return '';
  if(deferredInstall) return '<button class="install" data-act="install">Install app</button>';
  if(isIOS) return '<p class="hint">To install: tap Share, then Add to Home Screen.</p>';
  return '';
}
function doInstall(){
  if(!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.finally(()=>{ deferredInstall=null; if(!g.running && !ov.hidden) showStart(); });
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; if(!g.running && !ov.hidden && ov.querySelector('h1')) showStart(); });
window.addEventListener('appinstalled',()=>{ deferredInstall=null; if(!g.running && !ov.hidden && ov.querySelector('h1')) showStart(); });
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

showStart();
</script>
</body>
</html>
